<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyTracker{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: white;
            color: #2c3e50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav {
            display: flex;
            gap: 1rem;
        }

        nav a {
            color: #2c3e50;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: #2c3e50;
            color: white;
        }

        .login-btn, .logout-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover, .logout-btn:hover {
            background-color: #1a252f;
        }

        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0.1rem 1rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1, h2, h3 {
            color: #2c3e50;
        }

        a {
            color: #3498db;
        }

        a:hover {
            color: #216f9c;
        }

        button {
            cursor: pointer;
        }

        {% block style %}
        /* Стили для каждой страницы можно добавить тут */
        {% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="logo">StudyTracker</div>
        {% if user.is_authenticated %}
            <nav class="nav">
                <a href="{% url 'tracker' %}">Трекер</a>
                <a href="{% url 'statistics' %}">Статистика</a>
                <button class="logout-btn" onclick="location.href='{% url 'logout' %}'">Выйти</button>
            </nav>
        {% else %}
            <button class="login-btn" onclick="location.href='{% url 'login' %}'">Войти</button>
        {% endif %}
    </header>

    <main>
        {% block content %}
        Этот контент будет заменён на уникальный для каждой страницы.
        {% endblock %}
    </main>
</body>
</html>
